<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1100" height="720" fill="url(#bgGrad)"/>

  <!-- Title & Header -->
  <g transform="translate(50, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="1">100% PRIVATE &amp; ON-DEMAND CELLULAR ARCHITECTURE</text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">End-to-End Encrypted WireGuard Mesh with 1-Tap Phone Activation</text>
  </g>

  <!-- TOP SECTION: ON-DEMAND TOGGLE (NO 24/7 BACKGROUND LEAK) -->
  <g transform="translate(50, 110)">
    <rect width="1000" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- State 1: Default Offline -->
    <rect x="30" y="25" width="440" height="100" rx="10" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="65" cy="55" r="16" fill="#7f1d1d"/>
    <text x="60" y="60" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#f87171">✕</text>
    <text x="95" y="48" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#fca5a5">DEFAULT STATE: 100% OFFLINE</text>
    <text x="95" y="68" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8">• Zero background connections active</text>
    <text x="95" y="86" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8">• 0 MB cellular data used • 0% background battery drain</text>
    <text x="95" y="104" font-family="Segoe UI, sans-serif" font-size="12" fill="#f87171">• Phone remains completely invisible &amp; dark</text>

    <!-- Arrow Trigger -->
    <g transform="translate(485, 60)">
      <path d="M 0 15 L 25 15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="25,10 35,15 25,20" fill="#38bdf8"/>
      <text x="-5" y="-5" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">1-TAP ICON</text>
    </g>

    <!-- State 2: Active on Demand -->
    <rect x="530" y="25" width="440" height="100" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)"/>
    <circle cx="565" cy="55" r="16" fill="#065f46"/>
    <text x="560" y="60" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#34d399">✓</text>
    <text x="595" y="48" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7">ACTIVE STATE: TRIGGERED BY YOU</text>
    <text x="595" y="68" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Tap dedicated home screen icon on phone</text>
    <text x="595" y="86" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Private WireGuard tunnel wakes up instantly</text>
    <text x="595" y="104" font-family="Segoe UI, sans-serif" font-size="12" fill="#34d399">• Tap again anytime to terminate completely</text>
  </g>

  <!-- BOTTOM SECTION: PRIVATE ENCRYPTED MESH -->
  <g transform="translate(50, 290)">
    <rect width="1000" height="380" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>

    <!-- Left Box: Galaxy S22 -->
    <rect x="40" y="40" width="280" height="300" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="40" y="40" width="280" height="42" rx="10" fill="#1e293b"/>
    <text x="60" y="67" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">📱 GALAXY S22 (4G/5G)</text>
    
    <text x="60" y="115" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Private Mesh IP:</text>
    <rect x="60" y="125" width="240" height="30" rx="6" fill="#1e293b"/>
    <text x="75" y="145" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">100.x.y.z (Private)</text>

    <text x="60" y="185" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Security Features:</text>
    <text x="60" y="205" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">• Zero open ports to internet</text>
    <text x="60" y="225" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">• ChaCha20-Poly1305 encryption</text>
    <text x="60" y="245" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">• Hardware compositor UID 2000</text>
    <text x="60" y="265" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">• Snapchat &amp; Banking Safe</text>

    <rect x="60" y="285" width="240" height="34" rx="6" fill="#065f46"/>
    <text x="85" y="307" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">One-Tap Activation Widget</text>

    <!-- Center Bridge: WireGuard Encrypted Pipe -->
    <g transform="translate(350, 140)">
      <rect x="0" y="0" width="300" height="100" rx="10" fill="#064e3b" fill-opacity="0.8" stroke="#10b981" stroke-width="2"/>
      <text x="45" y="32" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7">🔒 DIRECT ENCRYPTED MESH</text>
      <text x="25" y="55" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">• Direct P2P over UDP (STUN / ICE)</text>
      <text x="25" y="73" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">• Sub-30ms ping within India (No US detour)</text>
      <text x="25" y="91" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">• Isolated to YOUR login account only</text>
      
      <!-- Bi-directional arrows -->
      <path d="M -20 50 L 0 50" stroke="#10b981" stroke-width="3"/>
      <path d="M 300 50 L 320 50" stroke="#10b981" stroke-width="3"/>
    </g>

    <!-- Right Box: Your Windows PC -->
    <rect x="680" y="40" width="280" height="300" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="680" y="40" width="280" height="42" rx="10" fill="#1e293b"/>
    <text x="700" y="67" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">💻 YOUR WINDOWS PC</text>

    <text x="700" y="115" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Private Mesh IP:</text>
    <rect x="700" y="125" width="240" height="30" rx="6" fill="#1e293b"/>
    <text x="715" y="145" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">100.x.y.w (Private)</text>

    <text x="700" y="185" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Native 60 FPS Launcher:</text>
    <text x="700" y="205" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">• Connects directly to phone's 100.x.y.z</text>
    <text x="700" y="225" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">• Zero latency handshake (&lt; 20ms)</text>
    <text x="700" y="245" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">• Direct3D 11 hardware mirror</text>

    <rect x="700" y="285" width="240" height="34" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="725" y="307" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">Double-Click MirrorKing.lnk</text>
  </g>
</svg>
