<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c2f"/>
    </linearGradient>
    <linearGradient id="scrcpyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#291002"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1100" height="700" fill="url(#bgGrad)"/>

  <!-- Title & Header -->
  <g transform="translate(50, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="1">MIRRORKING ARCHITECTURAL BLUEPRINT</text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">Why the Browser Buffers vs. The Recommended Zero-Alert Native Engine</text>
  </g>

  <!-- LEFT COLUMN: BROWSER CLIENT (Why it Buffers) -->
  <g transform="translate(50, 110)">
    <rect width="480" height="540" rx="14" fill="url(#browserGrad)" stroke="#b45309" stroke-width="2" filter="url(#glowOrange)"/>
    
    <rect x="20" y="20" width="440" height="42" rx="8" fill="#78350f" fill-opacity="0.6"/>
    <text x="35" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" fill="#fde68a">⚠️ BROWSER CLIENT (localhost:3000)</text>

    <!-- Node 1: MediaProjection -->
    <rect x="25" y="80" width="430" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="105" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#f87171">1. Userland Screen Capture (MediaProjection API)</text>
    <text x="40" y="125" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Standard Android API used by normal apps to record screens.</text>
    <text x="40" y="140" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Requires interactive user consent and triggers system listeners.</text>

    <!-- Arrow down -->
    <path d="M 240 150 L 240 175" stroke="#f87171" stroke-width="2" stroke-dasharray="4"/>

    <!-- Node 2: System Detection -->
    <rect x="25" y="175" width="430" height="85" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="40" y="200" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">2. Android 16 System Side-Effects (Why We Suppressed It)</text>
    <text x="40" y="220" font-family="Segoe UI, sans-serif" font-size="11" fill="#fecaca">❌ Status Bar Chip: "Phone is being monitored / Screen shared"</text>
    <text x="40" y="236" font-family="Segoe UI, sans-serif" font-size="11" fill="#fecaca">❌ Snapchat Alert: Detects capture and alerts contacts</text>
    <text x="40" y="252" font-family="Segoe UI, sans-serif" font-size="11" fill="#fecaca">❌ Banking Apps: Content blocked via FLAG_SECURE</text>

    <!-- Arrow down -->
    <path d="M 240 260 L 240 285" stroke="#f59e0b" stroke-width="2"/>

    <!-- Node 3: Current State -->
    <rect x="25" y="285" width="430" height="75" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.5"/>
    <text x="40" y="310" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#fcd34d">3. Intentional Suppression for Stealth</text>
    <text x="40" y="330" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">To satisfy user demand for 100% stealth and no Snapchat warnings,</text>
    <text x="40" y="345" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">the APK intentionally DOES NOT activate MediaProjection.</text>

    <!-- Arrow down -->
    <path d="M 240 360 L 240 385" stroke="#f59e0b" stroke-width="2"/>

    <!-- Node 4: Browser Result -->
    <rect x="25" y="385" width="430" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="410" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9">4. Browser Client Behavior</text>
    <text x="40" y="430" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">• WebCodecs receives 0 frames -> Canvas displays Stealth Dashboard</text>
    <text x="40" y="448" font-family="Segoe UI, sans-serif" font-size="11" fill="#38bdf8">• Cracked-Screen PIN unlock & text injector REMAIN FULLY ACTIVE</text>
    <text x="40" y="466" font-family="Segoe UI, sans-serif" font-size="11" fill="#38bdf8">• 1-Click Launch button added to trigger 60 FPS Native Window</text>
    <rect x="40" y="480" width="400" height="28" rx="6" fill="#1e293b"/>
    <text x="50" y="498" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Role: Emergency Web Console & PIN Unlocker</text>
  </g>

  <!-- RIGHT COLUMN: NATIVE ENGINE (Recommended Zero-Alert) -->
  <g transform="translate(570, 110)">
    <rect width="480" height="540" rx="14" fill="url(#scrcpyGrad)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>
    
    <rect x="20" y="20" width="440" height="42" rx="8" fill="#065f46" fill-opacity="0.8"/>
    <text x="35" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" fill="#6ee7b7">⭐ NATIVE MIRRORKING ENGINE (Recommended)</text>

    <!-- Node 1: SurfaceControl -->
    <rect x="25" y="80" width="430" height="70" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="105" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#34d399">1. Compositor Display Mirroring (SurfaceControl UID 2000)</text>
    <text x="40" y="125" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Bypasses userland APIs. Reads directly from Android hardware display.</text>
    <text x="40" y="140" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Runs under ADB Shell privileges without requesting capture permissions.</text>

    <!-- Arrow down -->
    <path d="M 240 150 L 240 175" stroke="#10b981" stroke-width="2"/>

    <!-- Node 2: Stealth Advantages -->
    <rect x="25" y="175" width="430" height="85" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="40" y="200" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">2. Stealth & Security Benefits (Zero Alerts)</text>
    <text x="40" y="220" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">✅ ZERO status bar icons or "monitored" notifications</text>
    <text x="40" y="236" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">✅ Snapchat SAFE: Zero screen-recording warnings sent</text>
    <text x="40" y="252" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">✅ Banking apps remain fully viewable</text>

    <!-- Arrow down -->
    <path d="M 240 260 L 240 285" stroke="#10b981" stroke-width="2"/>

    <!-- Node 3: Performance -->
    <rect x="25" y="285" width="430" height="75" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="310" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#34d399">3. Qualcomm Hardware Encoding & Direct3D 11</text>
    <text x="40" y="330" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Utilizes 'c2.qti.avc.encoder' for 60 FPS video at 15ms latency.</text>
    <text x="40" y="345" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">PC footprint: &lt; 25 MB RAM (compared to 300+ MB in browser).</text>

    <!-- Arrow down -->
    <path d="M 240 360 L 240 385" stroke="#10b981" stroke-width="2"/>

    <!-- Node 4: How to Use -->
    <rect x="25" y="385" width="430" height="135" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="410" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">4. The Correct Usage Process</text>
    <text x="40" y="430" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">• Double-click "MirrorKing" shortcut on Desktop (or launch-scrcpy.bat)</text>
    <text x="40" y="448" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">• Automatically routes via USB or Cellular Tunnel (127.0.0.1:7777)</text>
    <text x="40" y="466" font-family="Segoe UI, sans-serif" font-size="11" fill="#ecfdf5">• Press Alt + O to turn off broken screen while PC mirror stays on</text>
    <rect x="40" y="480" width="400" height="28" rx="6" fill="#047857"/>
    <text x="50" y="498" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Launch: Desktop Shortcut "MirrorKing" or launch-scrcpy.bat</text>
  </g>
</svg>
