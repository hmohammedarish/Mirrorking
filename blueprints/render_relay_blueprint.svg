    </text>

    <!-- Sub 1 -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="320" height="150" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.2"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
