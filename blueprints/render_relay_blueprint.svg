      </text>
      <rect x="15" y="105" width="290" height="30" rx="5" fill="#1e293b"/>
      <text x="25" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">
        Healthcheck: GET /healthz (200 OK)
      </text>
    </g>

    <!-- Sub 2 -->
    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="320" height="150" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.2"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#46e3b7">
        Zero-Copy Binary Pipe
      </text>
      <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
