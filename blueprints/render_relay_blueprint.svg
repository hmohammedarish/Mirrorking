      </text>
      <rect x="15" y="105" width="290" height="30" rx="5" fill="#064e3b" fill-opacity="0.4"/>
      <text x="25" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">
        Full Bi-directional High-Speed Pipe
      </text>
    </g>

    <!-- Sub 3 -->
    <g transform="translate(20, 415)">
      <rect x="0" y="0" width="320" height="150" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.2"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">
        Keep-Alive &amp; Anti-Idle
      </text>
      <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
        • 20-second WebSocket ping/pong pulses
      </text>
      <text x="15" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
        • Prevents Render proxy 60s idle drops
      </text>
      <text x="15" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
        • Keeps tunnel permanently open
      </text>
      <rect x="15" y="105" width="290" height="30" rx="5" fill="#581c87" fill-opacity="0.3"/>
      <text x="25" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d8b4fe">
        Permanent Standing Cellular Tunnel
      </text>
    </g>
  </g>

  <!-- RIGHT: USER PC -->
  <g transform="translate(830, 125)">
    <rect x="0" y="0" width="310" height="585" rx="16" fill="url(#pcGrad)" stroke="#10b981" stroke-width="2"/>
    
    <rect x="0" y="0" width="310" height="55" rx="16" fill="#047857" fill-opacity="0.25"/>
    <text x="20" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      YOUR WINDOWS 11 PC
    </text>
    <text x="20" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#a7f3d0">
      Anywhere • Low Spec (&lt;50MB RAM)
    </text>

    <!-- Sub 1 -->
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="280" height="150" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">
        1. PC Relay Bridge
      </text>
      <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • Connects to wss://.../pc
      </text>
      <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • Creates virtual ADB on 127.0.0.1:7777
      </text>
      <text x="15" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • Command: node pc/server.js --relay
      </text>
      <rect x="15" y="105" width="250" height="30" rx="5" fill="#047857" fill-opacity="0.4"/>
      <text x="25" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#a7f3d0">
        Binds Local Virtual Port 7777
      </text>
    </g>

    <!-- Sub 2 -->
    <g transform="translate(15, 245)">
      <rect x="0" y="0" width="280" height="150" rx="10" fill="#062e22" stroke="#34d399" stroke-width="1.2"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">
        2. Native Scrcpy Client
      </text>
      <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • Connects to 127.0.0.1:7777
      </text>
      <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • 1080x2336 60fps Direct3D11 window
      </text>
      <text x="15" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
