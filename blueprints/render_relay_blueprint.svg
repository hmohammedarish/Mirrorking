      </text>
      <rect x="15" y="105" width="250" height="30" rx="5" fill="#059669" fill-opacity="0.4"/>
      <text x="25" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f0fdf4">
        Interactive Desktop Experience
      </text>
    </g>

    <!-- Sub 3 -->
    <g transform="translate(15, 415)">
      <rect x="0" y="0" width="280" height="150" rx="10" fill="#062e22" stroke="#059669" stroke-width="1.2"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">
        3. 1-Click Launcher
      </text>
      <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • Double click "MirrorKing" shortcut
      </text>
      <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • Auto-connects via USB or Render
      </text>
      <text x="15" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">
        • Reconnects if cellular signal drops
      </text>
      <rect x="15" y="105" width="250" height="30" rx="5" fill="#064e3b"/>
      <text x="25" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#a7f3d0">
        Desktop Shortcut Ready
      </text>
    </g>
  </g>

  <!-- CONNECTING FLOW ARROWS -->
  <!-- Phone -> Render (WSS /phone) -->
  <path d="M 370, 240 L 420, 240" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowCyan)"/>
  <text x="365" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">WSS /phone</text>

  <!-- PC -> Render (WSS /pc) -->
  <path d="M 830, 240 L 780, 240" fill="none" stroke="#46e3b7" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowRender)"/>
  <text x="785" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#46e3b7">WSS /pc</text>

  <!-- Bidirectional Controls (Bottom) -->
  <path d="M 780, 320 L 830, 320" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowRender)"/>
  <text x="785" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981">ADB PACKETS</text>

  <path d="M 420, 320 L 370, 320" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="375" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981">TOUCH INJECT</text>

  <!-- Footer Banner -->
  <g transform="translate(60, 730)">
    <rect x="0" y="0" width="1080" height="45" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="25" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      RENDER.COM BLUEPRINT  •  NODE.JS WEBSOCKET RUNTIME  •  100% FREE TIER COMPLIANT  •  ZERO CARRIER CGNAT RESTRICTIONS
    </text>
  </g>
</svg>
