  <text x="780" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981">TOUCH &amp; KEYS</text>

  <path d="M 420, 310 L 370, 310" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="375" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981">INJECTED</text>

  <!-- Footer Banner -->
