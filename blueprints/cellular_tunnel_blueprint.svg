  <!-- FLOW ARROWS & DATA PATHS -->
  <!-- 1. Outbound Reverse Tunnel (Phone -> Internet) -->
  <path d="M 370, 240 L 420, 240" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowCyan)"/>
  <text x="365" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">OUTBOUND</text>

  <!-- 2. Internet -> PC -->
  <path d="M 780, 240 L 830, 240" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowCyan)"/>
  <text x="780" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">DELIVERED</text>

  <!-- 3. Return ADB Controls (PC -> Phone) -->
