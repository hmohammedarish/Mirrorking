    </g>

    <!-- Sub-Box 3: Fallback Web Controller -->
    <g transform="translate(15, 425)">
      <rect x="0" y="0" width="280" height="135" rx="10" fill="#062e22" stroke="#059669" stroke-width="1.2"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">
